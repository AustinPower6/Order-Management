target-version = "py311"

# language.json (de+en) und die getrennten Zusatzsprachdateien language.<code>.json
# zusätzlich als "Python" prüfen, damit doppelte Keys (F601) auffallen. JSON mit reinen
# String-Werten ist ein gültiges Python-Dict-Literal; ruff erkennt so Dubletten. Bewusst
# NUR diese Dateien – JSON mit true/false/null wäre kein gültiges Python (F821/E999-Lärm).
extend-include = ["app/language.json", "app/language.*.json"]

# Archivierte Referenzdatei (historische Migrationen) – bewusst nicht gepflegt.
# Review-Begleitdateien (language.<code>.review.json) enthalten true/false (kein gültiges
# Python) und werden vom include-Glob mitgematcht – hier wieder ausschließen.
extend-exclude = ["app/_alte_migrationen.py", "app/language.*.review.json"]

[lint]
select = ["F", "E9"]   # Pyflakes (undefined/unused) + Syntaxfehler
# F841 (ungenutzte lokale Variable) ist rein kosmetisch und nie ein Laufzeitfehler.
# Bewusst ignoriert, damit der Linter auf echte Bug-Klassen fokussiert bleibt:
# undefined names (F821), Redefinitionen (F811), Import-Shadowing (F402),
# ungenutzte Importe (F401).
ignore = ["F841"]
